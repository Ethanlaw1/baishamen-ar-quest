name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable

      - name: Rebuild Android scaffolding
        run: |
          rm -rf android
          flutter create --platforms=android --org com.example --project-name baishamen_ar_quest .

      - name: Patch Android project
        run: python3 scripts/patch_android.py

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: baishamen-ar-quest-apk
          path: build/app/outputs/flutter-apk/app-release.apk
